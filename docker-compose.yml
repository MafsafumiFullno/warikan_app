
services:
  api:
    build:
      context: ./backend
    container_name: warikan_api
    ports:
      - "8000:8000"
      - "9003:9003" # Xdebug
    volumes:
      - ./backend:/var/www
    command: |
      sh -c '
        if [ ! -d vendor ]; then
          composer install --no-interaction --prefer-dist --no-progress;
        fi;
        php artisan serve --host=0.0.0.0 --port=8000;
      '
    depends_on:
      - db

  web:
    build:
      context: ./frontend
    container_name: warikan_web
    environment:
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: |
      sh -c '
        if [ ! -d node_modules ]; then
          npm install;
        fi;
        npm run dev -- -p 3000;
      '
    depends_on:
      - api

  db:
    image: postgres:15
    container_name: warikan_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: warikan
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

